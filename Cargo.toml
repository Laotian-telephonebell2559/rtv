[package]
name = "rtv"
version = "1.0.0"
edition = "2021"
authors = ["Santitub"]
description = "rtv — ultra-fast terminal video player (Rust)"
license = "MIT OR Apache-2.0"

[dependencies]
# --- Video and audio decoding ---
# ffmpeg-the-third 5.0 with FFmpeg 7.1 (see BUILD-WINDOWS.md — important).
ffmpeg-the-third = { version = "5.0", default-features = false, features = [
    "codec",
    "format",
    "software-scaling",
    "software-resampling",
] }

# --- Terminal and events ---
crossterm = { version = "0.29", features = ["event-stream"] }

# --- Audio ---
# cpal: cross-platform access to WASAPI (Win), ALSA/PulseAudio (Linux),
# CoreAudio (Mac). OPTIONAL: it doesn't compile on Termux/Android (its
# AAudio/oboe backend needs the NDK and an app context) — the `pulse`
# backend is used there instead (see below).
cpal = { version = "0.15", optional = true }

# libloading: runtime dlopen of libpulse-simple for the PulseAudio
# backend (Termux, plus a Linux fallback). No build-time dependency on
# libpulse: if the lib isn't on the system it degrades cleanly.
libloading = { version = "0.8", optional = true }

# --- Concurrency ---
crossbeam-channel = "0.5"
parking_lot = "0.12"

# --- Utilities ---
anyhow = "1"
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
# zlib compression (RFC 1950) of the kitty graphics protocol payload
# (`o=z`): a 720p RGB frame is ~2.7 MB → ~1.3 MB in base64 PER FRAME,
# and that firehose of escapes is what chokes the terminal (kitty at
# 17 fps with a 24 fps video). Pure-Rust backend (miniz_oxide), no C
# dependencies.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
once_cell = "1"
# REAL cell width of each character (wide/emoji) — the HUD used to
# truncate counting 1 cell/char, and with width-2 characters the line
# overflowed `cols` → autowrap → scroll → visual garbage.
unicode-width = "0.2"

# --- Fast allocator ---
mimalloc = { version = "0.1", default-features = false }

# --- Optional GUI (`gui` feature) — mpv-style application mode ---
# Professional GPU stack: eframe brings together winit (window +
# events), wgpu (accelerated rendering with a software fallback via
# Vulkan/lavapipe or GL/llvmpipe) and egui (immediate-mode HUD with
# real typography, AA and widgets). The video is uploaded as a texture
# (RgbFrame RGB24 → egui::ColorImage) and the HUD is painted on top
# with egui — goodbye to the 5x7 bitmap font and softbuffer's software
# blit. It costs more binary size than winit+softbuffer, but the
# visual result is far superior (an explicit project decision).
# No default-features: drops accesskit (accessibility, ~30 crates),
# web_screen_reader and other weight that doesn't apply to a player.
eframe = { version = "0.36", optional = true, default-features = false, features = [
    "wgpu",          # GPU render backend (Vulkan/GL/Metal/DX12)
    "x11",           # X11 support on Linux
    "wayland",       # Wayland support on Linux
    "default_fonts", # egui's embedded typography for the HUD
] }

# libc: macOS ONLY, for the kitty protocol shm transport
# (shm_open/ftruncate/mmap — there is no /dev/shm on Mac and POSIX
# shm objects are only reachable via syscalls).
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[features]
# Both audio backends by default: cpal (WASAPI/ALSA/CoreAudio) and
# pulse (PulseAudio via dlopen — zero cost when no server is running).
# Termux/Android: build with `--no-default-features --features pulse`.
default = ["cpal-audio", "pulse"]
cpal-audio = ["dep:cpal"]
pulse = ["dep:libloading"]
# Optional GUI (mpv-style window). Terminal mode is the heart of the
# project and does NOT change: without this feature the binary is
# identical. Build: `cargo build --release --features gui`; use:
# `rtv --gui …`.
gui = ["dep:eframe"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
debug = false

[profile.dev]
opt-level = 1

# Fast-iteration profile (low-RAM CI/sandbox): same opt-level as
# release but without fat LTO or codegen-units=1, which are what blow
# up build time and memory. The official binary is still `release`
# (lto=fat).
# Use: `cargo build --profile sandbox --features gui`.
# MEASURED (2026-08-18, x86_64 GUI binary from CI): lto=false → 14.3 MB;
# lto="thin" → 15.0 MB (BIGGER!: thin's cross-crate inlining adds more
# than it removes as dead code in wgpu/naga). The only LTO that truly
# trims is "fat" (the official release already uses it), but its
# time/RAM cost isn't worth it for an iteration artifact. Bottom line:
# lto=false is both the fastest AND the smallest outside of fat —
# don't change it without re-measuring.
[profile.sandbox]
inherits = "release"
lto = false
codegen-units = 16
strip = true
